services:
  - type: web
    name: oencontrei-backend
    env: node
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npx prisma db push --accept-data-loss && npm run prisma:seed && node src/servidor.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://o-encontrei.vercel.app
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oencontrei-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: oencontrei-db
    databaseName: encontrei_db
    user: encontrei_user
    plan: free
